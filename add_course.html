{% extends "base.html" %}

{% block title %}
Add New Course
{% endblock %}

{% block content %}

<div class="container">

    <div class="section">

        <h1 class="section-title">
            Add New Course ➕
        </h1>

        <form
            method="POST"
            action="/admin/add-course"
            enctype="multipart/form-data"
            class="course-form"
        >

            <label>Course Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter course name"
                required
            >


            <label>Provider</label>

            <input
                type="text"
                name="provider"
                placeholder="Example: IBM"
                required
            >


            <label>Category</label>

            <input
                type="text"
                name="category"
                placeholder="Example: Data Science"
                required
            >


            <label>Description</label>

            <textarea
                name="description"
                placeholder="Enter course description"
                required
            ></textarea>


            <label>Duration</label>

            <input
                type="text"
                name="duration"
                placeholder="Example: 8 Hours"
                required
            >


            <label>Level</label>

            <select name="level">

                <option value="Beginner">
                    Beginner
                </option>

                <option value="Intermediate">
                    Intermediate
                </option>

                <option value="Advanced">
                    Advanced
                </option>

            </select>


            <label class="checkbox-label">

                <input
                    type="checkbox"
                    name="certificate"
                    value="1"
                >

                Certificate Available

            </label>


            <label>Course Link</label>

            <input
                type="url"
                name="link"
                placeholder="https://example.com"
                required
            >


            <!-- COURSE IMAGE -->

            <label>Course Image</label>

            <input
                type="file"
                name="image"
                accept=".jpg,.jpeg,.png,.webp"
            >

            <p>
                📸 Upload JPG, PNG or WEBP image
            </p>


            <button
                type="submit"
                class="btn"
            >
                ➕ Add Course
            </button>

        </form>


        <br>

        <a href="/admin">
            ← Back to Admin Dashboard
        </a>

    </div>

</div>

{% endblock %}
